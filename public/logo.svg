  <circle cx="256" cy="300" r="4" fill="#FEFCF3" opacity="0.6"/>
  <circle cx="282" cy="260" r="4" fill="#FEFCF3" opacity="0.6"/>
  <circle cx="245" cy="340" r="3.5" fill="#FEFCF3" opacity="0.6"/>
  <circle cx="270" cy="350" r="3.5" fill="#FEFCF3" opacity="0.6"/>
  <circle cx="256" cy="380" r="3" fill="#FEFCF3" opacity="0.6"/>
  <circle cx="220" cy="310" r="3.5" fill="#FEFCF3" opacity="0.6"/>
