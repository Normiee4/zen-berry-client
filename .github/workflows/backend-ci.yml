name: Backend CI

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'app/api/**'
      - 'lib/**'
      - 'features/**'

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate API routes structure
        run: |
          echo "Checking API routes..."
          ls -la app/api/
          
      - name: Type check API code
        run: npm run typecheck

      - name: Lint API routes
        run: npm run lint
        continue-on-error: true

  validate-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check service files exist
        run: |
          echo "Validating service layer..."
          for dir in app/api/*/; do
            if [ -f "${dir}service.ts" ]; then
              echo "✓ $(basename $dir) has service.ts"
            fi
            if [ -f "${dir}controller.ts" ]; then
              echo "✓ $(basename $dir) has controller.ts"
            fi
          done

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full type check
        run: npm run typecheck

      - name: Build to check for runtime errors
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-key'
          GEMINI_API_KEY: 'placeholder-key'